name: Validate Gunbreaker
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npm run balance
      - name: Check generated text is current
        run: git diff --exit-code -- scripts/catalogue.mjs RULES.html BALANCE.md migrations/current-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: gunbreaker-pf2e-candidate
          path: dist/gunbreaker-pf2e-*.zip
